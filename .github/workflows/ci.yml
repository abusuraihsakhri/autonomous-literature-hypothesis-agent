name: Literature Hypothesis Engine CI/CD

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest

    - name: Run Pytest Suite
      run: |
        python -m pytest -p no:zarr -v

    - name: Run CLI Batch Smoke Test
      run: |
        python cli.py batch -i sample.csv -o ci_batch_output.csv
        test -f ci_batch_output.csv
        python -c "import csv; rows = list(csv.DictReader(open('ci_batch_output.csv'))); assert len(rows) == 8; assert rows[0]['status'] == 'SUCCESS'"
