[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-literature-hypothesis-engine"
version = "2.0.0"
description = "BioHypothesis-Engine: Autonomous PubMed Knowledge Graph & Hypothesis Generator"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
autonomous-literature-hypothesis-engine = "bio_hypothesis.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/autonomous-literature-hypothesis-engine"
Repository = "https://github.com/abusuraihsakhri/autonomous-literature-hypothesis-engine.git"
